<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبارات بصمة السادس</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--h:260;--bg:#0d0b22;--bg2:#1a1245;--g1:rgba(120,80,255,.4);--sf:rgba(255,255,255,.08);--ink:#f3f0ff;--mut:#a79fd0;--line:rgba(255,255,255,.14);--acc:#8b6bff;--onacc:#fff;--ts:85%;--tl:60%;--ton:#120d2c;--rad:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:400 16px/1.55 "Readex Pro",Tahoma,sans-serif;color:var(--ink);background:radial-gradient(120% 55% at 50% 0%,var(--g1),transparent 62%),linear-gradient(180deg,var(--bg),var(--bg2)) fixed;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 96px)}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hd,.sr,#hero,#list{position:relative;z-index:1}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 8px}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.hi{color:var(--mut);font-size:13px}
h1{font:800 21px/1.25 "Baloo Bhaijaan 2","Readex Pro",sans-serif;margin:0}
.acts{display:flex;gap:6px;flex:none}
.ib{min-width:40px;height:40px;padding:0 11px;border-radius:14px;border:1px solid var(--line);background:var(--sf);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);display:inline-grid;place-items:center;font:600 14px "Readex Pro",sans-serif}
.ib:active,.it:active{transform:scale(.95)}
.sr{margin:6px 0 14px}
#q{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--sf);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:inherit;outline:0}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
.sum{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:14px;border-radius:20px;background:var(--sf);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sum b{font:800 24px/1 "Baloo Bhaijaan 2",sans-serif;display:block}
small{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list{display:grid;gap:10px}
.it{cursor:pointer;transition:transform .15s}
.tile{position:relative;overflow:hidden;min-height:158px;padding:14px;border-radius:var(--rad);color:var(--ton);display:flex;flex-direction:column;justify-content:space-between;gap:8px;
 background:linear-gradient(150deg,hsl(var(--h) var(--ts) var(--tl)),hsl(calc(var(--h) + 30) var(--ts) calc(var(--tl) - 12%)));
 box-shadow:0 14px 28px -12px hsl(var(--h) var(--ts) var(--tl)),inset 0 2px 0 rgba(255,255,255,.35)}
.tile::after{content:"";position:absolute;inset-inline-start:-34px;top:-34px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none}
.ico{font-size:44px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));position:relative;z-index:1}
.tile .nm{font:800 20px/1.2 "Baloo Bhaijaan 2",sans-serif}
.pg{height:7px;border-radius:6px;background:var(--line);overflow:hidden}
.tile .pg{background:rgba(255,255,255,.4)}
.pg i{display:block;height:100%;border-radius:6px;background:hsl(var(--h) var(--ts) var(--tl))}
.tile .pg i{background:var(--ton);opacity:.7}
.tile small{color:inherit;font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 16px;border-radius:20px;background:var(--sf);border:1px solid var(--line);border-inline-start:6px solid hsl(var(--h) var(--ts) var(--tl));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.row .nm{flex:1;font-weight:600}
.row .nm small{display:block;font-weight:400}
.row i{font-style:normal;color:var(--mut);font-size:13px}
.off{opacity:.45}
.ctl{display:flex;gap:4px;width:100%;justify-content:flex-end;position:relative;z-index:2}
.ctl b{font-weight:400;background:rgba(0,0,0,.4);border-radius:10px;padding:2px 7px;color:#fff}
.empty{text-align:center;color:var(--mut);padding:44px 0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .ib{flex:none;height:38px}
.goal{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;border-radius:20px;background:var(--sf);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);cursor:pointer}
.ring{position:relative;width:66px;height:66px;border-radius:50%;flex:none;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
.ring::after{content:attr(data-t);position:absolute;inset:7px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:800 16px "Baloo Bhaijaan 2",sans-serif}
.gt{flex:1}.gt b{display:block}
.cont{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:12px;border-radius:20px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));color:var(--onacc);cursor:pointer}
.cont b{display:block;font:800 17px "Baloo Bhaijaan 2",sans-serif}
.cont small{color:inherit;opacity:.85}
.star{font-size:19px;color:var(--mut);padding:0 4px}
.star.on{color:#f5b301}
em.nw{font-style:normal;background:#ff3b5c;color:#fff;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.tile em.nw{position:absolute;top:12px;inset-inline-end:12px;z-index:2}
.cf{position:fixed;top:-24px;z-index:40;pointer-events:none;animation:cf 2.4s ease-in forwards}
@keyframes cf{to{transform:translateY(108vh) rotate(540deg)}}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd2{padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--sf);text-align:center}
.bd2 span{font-size:32px;display:block}
.bd2 small{display:block}
.bd2.lk{opacity:.35;filter:grayscale(1)}
.rt{display:grid;gap:10px}
.rt button{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--sf);color:var(--ink);font:600 16px "Readex Pro",sans-serif}
/* ===== شخصية كل مود ===== */
[data-th=night] #fx{background:radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 30%,#fff,transparent),radial-gradient(2px 2px at 40% 60%,#cfc6ff,transparent),radial-gradient(1px 1px at 85% 75%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#fff,transparent),radial-gradient(1px 1px at 55% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 8%,#fff,transparent);animation:tw 3.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
[data-th=red] #fx{background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 24px),radial-gradient(120% 70% at 50% 125%,rgba(255,30,60,.4),transparent 60%)}
[data-th=red] .tile{box-shadow:0 14px 28px -10px hsl(var(--h) 90% 50%/.8),inset 0 2px 0 rgba(255,255,255,.4)}
[data-th=neon] #fx{background:linear-gradient(rgba(0,255,200,.08) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(0,255,200,.08) 1px,transparent 1px) 0 0/34px 34px}
[data-th=neon] .tile{background:rgba(2,12,14,.8);color:var(--ink);border:1.5px solid hsl(var(--h) 100% 55%);box-shadow:0 0 20px hsl(var(--h) 100% 55%/.5),inset 0 0 20px hsl(var(--h) 100% 55%/.16)}
[data-th=neon] .tile::after{display:none}
[data-th=neon] .tile .pg{background:rgba(255,255,255,.12)}
[data-th=neon] .tile .pg i{background:hsl(var(--h) 100% 55%);opacity:1;box-shadow:0 0 8px hsl(var(--h) 100% 55%)}
[data-th=neon] .ico{filter:drop-shadow(0 0 8px hsl(var(--h) 100% 55%))}
[data-th=neon] h1{text-shadow:0 0 14px var(--acc)}
[data-th=sunset] #fx{background:radial-gradient(circle at 82% 12%,#fff6bf 0,#ffd166 5%,rgba(255,150,60,.6) 13%,transparent 30%)}
[data-th=girls] .tile::before{content:"✨";position:absolute;inset-inline-end:12px;bottom:10px;opacity:.75}
.hh{position:absolute;bottom:-40px;animation:fl linear infinite;opacity:0}
@keyframes fl{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-115vh) rotate(28deg);opacity:0}}
[data-th=boys] #fx{background:repeating-linear-gradient(45deg,rgba(21,96,232,.08) 0 8px,transparent 8px 16px),radial-gradient(90% 40% at 100% 0,rgba(21,96,232,.25),transparent 70%)}
[data-th=boys] .tile{border-radius:6px;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));box-shadow:none}
[data-th=boys] .row,[data-th=boys] .sum,[data-th=boys] .ib,[data-th=boys] #q{border-radius:8px}
/* ===== */
#bar{position:fixed;inset:auto 0 0 0;direction:ltr;display:flex;gap:10px;justify-content:flex-start;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg2);border-top:1px solid var(--line);z-index:5}
#bar button,.bt button{direction:rtl;border:0;background:var(--acc);color:var(--onacc);border-radius:14px;padding:11px 18px;font:600 15px "Readex Pro",sans-serif}
.bt .g{background:var(--sf);color:var(--ink);border:1px solid var(--line)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:9}
[hidden]{display:none!important}
.sheet{background:var(--bg2);color:var(--ink);width:100%;max-height:86vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 80px);border-top:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h3{margin:0;font:800 22px "Baloo Bhaijaan 2",sans-serif}
.sheet input{width:100%;margin-bottom:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--sf);color:var(--ink);font:inherit}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{height:100px;border-radius:20px;border:2px solid var(--line);padding:11px;display:flex;flex-direction:column;justify-content:space-between;text-align:start;font:700 16px "Baloo Bhaijaan 2",sans-serif}
.pv span{display:flex;gap:6px}
.pv i{width:36px;height:26px;border-radius:9px}
.pv.on{border-color:var(--acc);outline:2px solid var(--acc)}
.bt{display:flex;gap:10px;margin-top:6px}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:30;font-size:14px}
#fr{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.frbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.frbar b{flex:1;text-align:center;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ifr{flex:1;width:100%;border:0;background:#fff}
#dg{position:relative;z-index:2;margin:6px 0 10px;padding:10px 14px;border-radius:14px;background:#ff3b5c;color:#fff;font-size:13px}
.city{margin-bottom:12px;border-radius:22px;overflow:hidden;background:var(--sf);border:1px solid var(--line);cursor:pointer}
.city svg{display:block;width:100%;height:auto}
.city .ct{padding:8px 14px 12px;display:flex;flex-direction:column;gap:2px}
.city .ct b{font:800 20px "Baloo Bhaijaan 2",sans-serif}
.dst{display:flex;align-items:center;gap:10px;margin:9px 0}
.dst .nm2{width:104px;font-weight:600;font-size:14px}
.dst .pg{flex:1}
.dst small{width:72px;text-align:end}
#sp{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 55% at 50% 0%,var(--g1),transparent 62%),linear-gradient(180deg,var(--bg),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s}
#sp.o{opacity:0;pointer-events:none}
#sp .lg{font-size:76px;animation:bn 1.1s ease-in-out infinite alternate}
@keyframes bn{to{transform:translateY(-10px) scale(1.06)}}
#sp b{font:800 24px "Baloo Bhaijaan 2",sans-serif}
#sp .ld{width:150px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
#sp .ld i{display:block;height:100%;width:40%;border-radius:6px;background:var(--acc);animation:ld 1s ease-in-out infinite alternate}
@keyframes ld{to{transform:translateX(-150%)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}#sp .lg,#sp .ld i{animation:none}*{transition:none!important}#fx{animation:none!important}.hh{display:none}}
/* ===== الصفحة الرئيسية الجديدة ===== */
.ib.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ib svg{display:block}
.hm{display:grid;gap:12px}
.hero2{border-radius:26px;padding:18px;background:color-mix(in srgb,var(--acc) 26%,var(--sf));color:var(--ink);cursor:pointer;transition:transform .15s}
.hero2:active,.card:active{transform:scale(.97)}
.hero2 h2{font:800 25px/1.25 "Baloo Bhaijaan 2",sans-serif;margin:0}
.hero2 small{color:inherit;opacity:.72;font-size:14px}
.hero2 .go{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600}
.hero2 .bk{width:46px;height:46px;border-radius:16px;background:var(--sf);display:grid;place-items:center;color:var(--acc)}
.hero2 .ar{margin-inline-start:auto;font-size:20px}
.st2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;cursor:pointer;transition:transform .15s}
.card .ci{color:var(--acc);display:flex}
.card b{font:800 21px/1.2 "Baloo Bhaijaan 2",sans-serif;display:block}
.card.soon{opacity:.7}
.card em.sn{position:absolute;top:12px;inset-inline-end:12px;font-style:normal;font-size:11px;color:var(--mut);background:var(--line);padding:1px 8px;border-radius:99px}
.sec{font:800 19px "Baloo Bhaijaan 2",sans-serif;margin:8px 2px 0}
.lt{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:8px 16px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.lh b{font:800 18px "Baloo Bhaijaan 2",sans-serif}
.lnk{color:var(--acc);font-size:13px;cursor:pointer}
.lt .r{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.lt .r .ri{font-size:22px}.lt .r .nm{flex:1;font-weight:600}.lt .r .nm small{display:block;font-weight:400}
.sr{margin-top:0}
/* ===== مود كرتون ===== */
[data-th=toon] #fx{background:radial-gradient(rgba(27,27,27,.18) 1.6px,transparent 1.8px) 0 0/20px 20px}
[data-th=toon] .card,[data-th=toon] .hero2,[data-th=toon] .lt,[data-th=toon] .goal,[data-th=toon] .sum,[data-th=toon] .row,[data-th=toon] .city,[data-th=toon] .bd2{border:3px solid #1b1b1b;box-shadow:4px 4px 0 #1b1b1b}
[data-th=toon] .tile{border:3px solid #1b1b1b;box-shadow:5px 5px 0 #1b1b1b}
[data-th=toon] .tile::after{display:none}
[data-th=toon] .ib,[data-th=toon] #q{border:2.5px solid #1b1b1b;box-shadow:2px 2px 0 #1b1b1b;-webkit-backdrop-filter:none;backdrop-filter:none}
[data-th=toon] .card:active,[data-th=toon] .hero2:active,[data-th=toon] .tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b1b1b}
[data-th=toon] .st2 .card:nth-child(4n+1){background:#9be7ff}
[data-th=toon] .st2 .card:nth-child(4n+2){background:#ffb3d1}
[data-th=toon] .st2 .card:nth-child(4n+3){background:#b6f08a}
[data-th=toon] .st2 .card:nth-child(4n+4){background:#ffd37a}
[data-th=toon] .hero2{background:#ff8fb8}
[data-th=toon] .card .ci{color:#1b1b1b}
[data-th=toon] .card em.sn{background:#fff;border:2px solid #1b1b1b;color:#1b1b1b}
[data-th=toon] .pg{background:#fff;border:2px solid #1b1b1b}
[data-th=toon] .sheet{border-top:3px solid #1b1b1b}
[data-th=toon] h1,[data-th=toon] .sec{text-shadow:2px 2px 0 #fff}
.tile{min-height:112px;justify-content:flex-end}
.hd .ib{min-width:36px;height:38px;padding:0 8px}
.acts{gap:5px}
.row .opn{font:700 13px/1 "Baloo Bhaijaan 2",sans-serif;padding:8px 18px;border-radius:99px;background:var(--acc);color:var(--onacc);cursor:pointer;white-space:nowrap}
[data-th=toon] .row .opn{border:2.5px solid #1b1b1b;box-shadow:2px 2px 0 #1b1b1b;color:#fff}
[data-th=toon] .row .opn:active{transform:translate(2px,2px);box-shadow:0 0 0 #1b1b1b}

/* ===== جدولي الدراسي داخل بصمة السادس ===== */
.sched{display:grid;gap:14px;padding-bottom:20px}
.sch-hero{position:relative;overflow:hidden;padding:20px;border-radius:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 35%,var(--bg2)),var(--sf));border:1px solid var(--line)}
.sch-hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:50%;inset-inline-start:-72px;top:-90px;box-shadow:0 0 0 18px color-mix(in srgb,var(--acc) 8%,transparent),0 0 0 38px color-mix(in srgb,var(--acc) 5%,transparent)}
.sch-kicker{font-size:11px;letter-spacing:1.5px;color:var(--mut);font-weight:600}
.sch-hero h2{font:800 27px/1.3 "Baloo Bhaijaan 2",sans-serif;margin:7px 0}
.sch-hero p{font-size:13px;color:var(--mut);margin:0;max-width:290px}
.sch-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sch-btn{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:16px;padding:13px 12px;font:600 13px "Readex Pro",sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.sch-btn.primary{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.sch-tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:2px 0}
.sch-tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:var(--sf);color:var(--mut);padding:9px 14px;font:600 12px "Readex Pro",sans-serif}
.sch-tabs button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.sch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sch-stat{padding:13px 9px;border:1px solid var(--line);border-radius:17px;background:var(--sf);text-align:center}
.sch-stat b{display:block;font:800 21px "Baloo Bhaijaan 2",sans-serif}
.sch-stat small{font-size:10px}
.sch-panel{padding:15px;border:1px solid var(--line);border-radius:21px;background:var(--sf)}
.sch-panel h3{font:800 18px "Baloo Bhaijaan 2",sans-serif;margin:0 0 12px}
.sch-timeline{display:grid;gap:0;position:relative}
.sch-event{display:grid;grid-template-columns:62px 13px 1fr;gap:9px;min-height:67px}
.sch-time{font:600 12px "Baloo Bhaijaan 2",sans-serif;color:var(--mut);padding-top:12px;direction:ltr;text-align:right}
.sch-track{position:relative;display:flex;justify-content:center}
.sch-track:before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.sch-dot{position:relative;margin-top:15px;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.sch-event.break .sch-dot{background:#8c9aaa;box-shadow:0 0 0 4px rgba(140,154,170,.13)}
.sch-event.fixed .sch-dot{background:#d69a52;box-shadow:0 0 0 4px rgba(214,154,82,.13)}
.sch-event.done .sch-dot{background:#36b88a;box-shadow:0 0 0 4px rgba(54,184,138,.13)}

async function upFile(f){if(!f)return;const st=$('#ups'),ok=$('#ok');

 try{let r;
  for(const b of APIS){try{const q=await fetch(b+'/upload',{method:'POST',headers:{'x-init':tg?tg.initData:'','x-name':encodeURIComponent(f.name),'Content-Type':f.type||'application/octet-stream'},body:f});
   r=q;if(q.status===401||q.status===404||q.status>=502)continue;break}catch(e){}}
  const j=await r.json();if(!r.ok||!j.url)throw 0;

 const subjectHtml=names.map(n=>{const x=selected.get(n);return `<label class="sch-pick"><input type="checkbox" class="sch-sub-check" value="${n}" ${x?'checked':''}><span>${n}</span><small>محاضرات بالأسبوع</small><input class="sch-sub-count" type="number" data-count="${n}" min="1" max="14" value="${x?.count||2}" aria-label="عدد محاضرات ${n}"></label>`}).join('');

 <div class="sch-field"><label>1. فرعك الدراسي</label><select id="sch-branch"><option value="sci" ${sch.branch==='sci'?'selected':''}>علمي</option><option value="lit" ${sch.branch==='lit'?'selected':''}>أدبي</option></select></div>
 <div class="sch-form-grid"><div class="sch-field"><label>2. شوكت تبدي دراسة عادةً؟</label><input id="sch-start" type="time" value="${schClock(sch.start)}"></div><div class="sch-field"><label>كم ساعة تكدر تدرس باليوم؟</label><select id="sch-hours">${[2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===Number(sch.dailyHours)?'selected':''}>${n} ساعات</option>`).join('')}</select></div></div>
 <div class="sch-field"><label>3. اختار المواد وكم محاضرة لكل مادة بالأسبوع</label><div class="sch-subject-list">${subjectHtml}</div><small class="sch-note">مثلاً: تختار الكيمياء وتكتب 3 محاضرات بالأسبوع. مدة المحاضرة ساعة تقريباً والموقع يحسبها لوحده.</small></div>`,()=>{
  const branch=$('#sch-branch').value,subs=[...document.querySelectorAll('.sch-sub-check:checked')].map(c=>({name:c.value,count:Math.max(1,Math.min(14,Number(document.querySelector(`[data-count="${c.value}"]`).value)||1)),minutes:60}));
  if(!subs.length){toast('اختَر مادة واحدة على الأقل');return false}
  const start=schTime('sch-start'),dailyHours=Number($('#sch-hours').value)||4;
  sch={...sch,branch,start,dailyHours,subjects:subs};schSave();schedTab='today';renderSchedule();
 },'إنشاء جدولي','رتّب جدولي');
 $('#sch-branch').onchange=()=>{sch.branch=$('#sch-branch').value;schSetup()};
}

/* ===== جدولي v6: الطالب يبني جدوله بنفسه بالدقيقة ===== */
const TT_SHORT=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const TT_SUBJ=['فيزياء','كيمياء','أحياء','رياضيات','عربي','إنجليزي','إسلامية','تاريخ','جغرافية','اقتصاد','مراجعة عامة'];
const TT_PRESETS=[{n:'النوم',s:'23:00',e:'06:00',d:[0,1,2,3,4,5,6]},{n:'المدرسة',s:'07:30',e:'13:30',d:[0,1,2,3,4]},{n:'الغداء',s:'14:00',e:'15:00',d:[0,1,2,3,4,5,6]}];
const TT_DEF={busy:[],slots:[],done:{},weekId:''};
let tt=ls.get('jadwal_tt',null);
if(!tt||!Array.isArray(tt.slots)||!Array.isArray(tt.busy))tt=JSON.parse(JSON.stringify(TT_DEF));
tt={...TT_DEF,...tt};
function ttSave(){ls.set('jadwal_tt',tt)}
(function(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());const wid=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(tt.weekId!==wid){tt.done={};tt.weekId=wid;ttSave()}})();

const ttMin=id=>{const v=(document.getElementById(id)||{}).value||'',m=v.match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
const ttDays=sel=>[...document.querySelectorAll(sel+':checked')].map(c=>+c.value);
const ttErr=m=>{const b=document.getElementById('tt-err');if(b){b.textContent=m;b.hidden=false}return false};
const ttDayPicks=sel=>`<div class="sch-day-picks">${SCH_DAYS.map((n,i)=>`<label><span>${TT_SHORT[i]}</span><input type="checkbox" class="tt-d" value="${i}" ${sel.includes(i)?'checked':''}></label>`).join('')}</div><button type="button" class="tt-link" data-tt="alldays">كل الأيام</button>`;

function ttBusySpans(b,day){const o=[];if(b.s<b.e){if(b.days.includes(day))o.push([b.s,b.e])}else{if(b.days.includes(day))o.push([b.s,1440]);if(b.days.includes((day+6)%7))o.push([0,b.e])}return o}
function ttSpans(day,skipSlot){const o=[];tt.busy.forEach(b=>ttBusySpans(b,day).forEach(r=>o.push({s:r[0],e:r[1],name:b.name,type:'busy',id:b.id})));tt.slots.forEach(x=>{if(x.id!==skipSlot&&x.days.includes(day))o.push({s:x.s,e:x.e,name:x.subject,type:'slot',id:x.id})});return o.sort((a,b)=>a.s-b.s||a.e-b.e)}
function ttClash(day,s,e,skipSlot){return ttSpans(day,skipSlot).find(x=>s<x.e&&e>x.s)}
function ttBusyVsSlots(b){for(const x of tt.slots)for(const d of x.days)for(const r of ttBusySpans(b,d))if(x.s<r[1]&&x.e>r[0])return x;return null}
function ttFree(day){let used=0,end=0;ttSpans(day).forEach(x=>{const s=Math.max(x.s,end);if(x.e>s){used+=x.e-s;end=x.e}});return 1440-used}

function ttSlotForm(id,day){
 const x=id?tt.slots.find(v=>v.id===id):null,sel=x?x.days:[day!==undefined?day:new Date().getDay()],known=x?TT_SUBJ.includes(x.subject):true;
 modal(`<div class="sch-guide"><b>${x?'عدّل الفترة':'فترة دراسة جديدة'}</b><p>اختار المادة، وحدد من شوكت لشوكت بالدقيقة، وأي أيام تتكرر.</p></div>
 <div class="sch-field"><label>المادة</label><select id="tf-subj">${TT_SUBJ.map(n=>`<option ${x&&known&&x.subject===n?'selected':''}>${n}</option>`).join('')}<option value="other" ${x&&!known?'selected':''}>مادة ثانية</option></select><input id="tf-custom" placeholder="اكتب اسم المادة" value="${x&&!known?esc(x.subject):''}" ${x&&!known?'':'hidden'}></div>
 <div class="sch-form-grid"><div class="sch-field"><label>من الساعة</label><input id="tf-s" type="time" value="${x?schClock(x.s):'16:00'}"></div><div class="sch-field"><label>إلى الساعة</label><input id="tf-e" type="time" value="${x?schClock(x.e):'17:00'}"></div></div>
 <div class="sch-field"><label>الأيام</label>${ttDayPicks(sel)}</div>
 <div id="tt-err" class="sch-warning" hidden></div>
 ${x?`<button type="button" class="sch-btn tt-del" data-tt-del="${x.id}">🗑 احذف هالفترة</button>`:''}`,()=>{
  let name=$('#tf-subj').value;if(name==='other')name=$('#tf-custom').value.trim();
  const s=ttMin('tf-s'),e=ttMin('tf-e'),days=ttDays('.tt-d');
  if(!name)return ttErr('اكتب اسم المادة');
  if(s==null||e==null)return ttErr('حدد وقت البداية والنهاية');
  if(e<=s)return ttErr('وقت النهاية لازم يكون بعد البداية');
  if(e-s<10)return ttErr('أقل فترة 10 دقايق');
  if(!days.length)return ttErr('اختار يوم واحد على الأقل');
  for(const d of days){const c=ttClash(d,s,e,x&&x.id);if(c)return ttErr(`تتداخل مع «${c.name}» يوم ${SCH_DAYS[d]} (${schFmt(c.s)} – ${schFmt(c.e)})`)}
  if(x){x.subject=name;x.s=s;x.e=e;x.days=days}else tt.slots.push({id:uid(),subject:name,days,s,e});
  ttSave();if(days.length===1)schedDay=days[0];renderSchedule();
 },'حفظ الفترة',x?'تعديل':'إضافة');
 $('#tf-subj').onchange=()=>{$('#tf-custom').hidden=$('#tf-subj').value!=='other'};
}

function ttBusyForm(id){

 },'حفظ','أوقاتي المشغولة');

function ttSuggest(){
 const sci=['فيزياء','كيمياء','أحياء','رياضيات','عربي','إنجليزي','إسلامية'],lit=['عربي','إنجليزي','إسلامية','تاريخ','جغرافية','اقتصاد','رياضيات'];
 modal(`<div class="sch-guide"><b>خلّي الموقع يقترح</b><p>يعبّي لك الفراغات بين أوقاتك المشغولة، وبين كل فترتين استراحة 10 دقايق. وبعدين تعدّل اللي ما يعجبك.</p></div>
 <div class="sch-field"><label>فرعك</label><select id="ts-branch"><option value="sci">علمي</option><option value="lit">أدبي</option></select></div>
 <div class="sch-field"><label>المواد</label><div class="tt-chips">${TT_SUBJ.map(n=>`<label class="tt-chip"><input type="checkbox" class="ts-sub" value="${n}" ${sci.includes(n)?'checked':''}><span>${n}</span></label>`).join('')}</div></div>
 <div class="sch-form-grid"><div class="sch-field"><label>أبدي دراسة من</label><input id="ts-s" type="time" value="16:00"></div><div class="sch-field"><label>وأخلّص قبل</label><input id="ts-e" type="time" value="21:00"></div></div>
 <div class="sch-form-grid"><div class="sch-field"><label>طول الفترة</label><select id="ts-len"><option value="45">45 دقيقة</option><option value="60" selected>ساعة</option><option value="90">ساعة ونص</option></select></div><div class="sch-field"><label>شكد فترة باليوم</label><select id="ts-n"><option>2</option><option selected>3</option><option>4</option></select></div></div>
 <div id="tt-err" class="sch-warning" hidden></div>`,()=>{
  const subs=[...document.querySelectorAll('.ts-sub:checked')].map(c=>c.value),ws=ttMin('ts-s'),we=ttMin('ts-e'),len=+$('#ts-len').value,per=+$('#ts-n').value;
  if(!subs.length)return ttErr('اختار مادة وحدة على الأقل');
  if(ws==null||we==null||we-ws<len)return ttErr('الوقت اللي حددته أقصر من طول الفترة');
  let added=0,ri=0;
  for(let d=0;d<7;d++){let cur=ws,n=0;while(n<per&&cur+len<=we){const c=ttClash(d,cur,cur+len);if(c){cur=c.e+10;continue}tt.slots.push({id:uid(),subject:subs[ri++%subs.length],days:[d],s:cur,e:cur+len});added++;n++;cur+=len+10}}
  if(!added)return ttErr('ما لكيت فراغ يكفي. وسّع الوقت أو قصّر الفترة.');
  ttSave();schedTab='today';toast('ضفنا '+added+' فترة، عدّل عليها كيفك');renderSchedule();
 },'اقترح لي','اقترح لي جدول');
 $('#ts-branch').onchange=()=>{const l=$('#ts-branch').value==='lit'?lit:sci;document.querySelectorAll('.ts-sub').forEach(c=>c.checked=l.includes(c.value))};
}

function ttCopyForm(){
 const src=schedDay,n=tt.slots.filter(x=>x.days.includes(src)).length;
 if(!n)return toast('ماكو فترات بهذا اليوم تنسخها');
 modal(`<div class="sch-guide"><b>انسخ ${SCH_DAYS[src]}</b><p>تنسخ فترات ${SCH_DAYS[src]} (${n}) لأيام ثانية. الفترة اللي تتداخل مع شي موجود تنتخطى.</p></div><div class="sch-field"><label>انسخ إلى</label>${ttDayPicks([])}</div><div id="tt-err" class="sch-warning" hidden></div>`,()=>{
  const days=ttDays('.tt-d').filter(d=>d!==src);if(!days.length)return ttErr('اختار يوم ثاني غير '+SCH_DAYS[src]);
  let ok=0,skip=0;const list=tt.slots.filter(x=>x.days.includes(src));
  days.forEach(d=>list.forEach(x=>{if(ttClash(d,x.s,x.e))skip++;else{tt.slots.push({id:uid(),subject:x.subject,days:[d],s:x.s,e:x.e});ok++}}));
  ttSave();toast('نسخنا '+ok+(skip?' وانتخطينا '+skip+' بسبب تداخل':''));renderSchedule();
 },'انسخ','نسخ اليوم');
}

function ttDayHtml(d){
 const spans=ttSpans(d);if(!spans.length)return '';
 let h='',prev=null;
 spans.forEach(x=>{
  if(x.type==='slot'){const key=x.id+'_'+d,yes=!!tt.done[key];
   if(prev&&prev.type==='slot'&&x.s-prev.e<10)h+='<div class="tt-gap">⏸ ما بين الفترتين استراحة، خذ 10 دقايق</div>';
   h+=`<div class="tt-row"><button class="sch-checktask ${yes?'is-done':''}" data-tt-done="${key}"><span class="sch-check">${yes?'✓':'●'}</span><span class="sch-task-copy"><b>${esc(x.name)}</b><small>${schFmt(x.s)} – ${schFmt(x.e)} · ${schDur(x.e-x.s)}</small></span><span class="sch-task-state">${yes?'مكتملة':'إنجاز'}</span></button><button class="tt-edit" data-tt-edit="${x.id}" aria-label="تعديل">✎</button></div>`;
  }else h+=`<div class="tt-busy"><span>${esc(x.name)}</span><small>${schFmt(x.s)} – ${schFmt(x.e===1440?0:x.e)}</small></div>`;
  prev=x});
 return `<div class="tt-list">${h}</div>`;
}

 const D=t.dataset;
 if(D.ttDone!==undefined){tt.done[D.ttDone]=!tt.done[D.ttDone];ttSave();return renderSchedule()}
 if(D.ttEdit)return ttSlotForm(D.ttEdit);

 if(D.ttDel){tt.slots=tt.slots.filter(x=>x.id!==D.ttDel);ttSave();$('#m').hidden=true;return renderSchedule()}
 if(D.ttBdel){tt.busy=tt.busy.filter(x=>x.id!==D.ttBdel);ttSave();$('#m').hidden=true;return renderSchedule()}
 if(D.ttDay!==undefined){schedDay=+D.ttDay;return renderSchedule()}
 if(D.ttPreset!==undefined){const p=TT_PRESETS[+D.ttPreset];$('#tb-name').value=p.n;$('#tb-s').value=p.s;$('#tb-e').value=p.e;document.querySelectorAll('.tt-d').forEach(c=>c.checked=p.d.includes(+c.value));return}

/* ===== جدولي v7: أقسام حسب مشكلة الطالب، وبيانات مهام مشتركة ===== */
const JD_SUBJ=['فيزياء','كيمياء','أحياء','رياضيات','عربي','إنجليزي','إسلامية','تاريخ','جغرافية','اقتصاد'];
const JD_KIND={backlog:'تراكم',week:'أسبوعي',daily:'يومي',extra:'مضافة'};
const JD_RANK={backlog:0,week:1,extra:1,daily:2};
const JD_ICO={
 cal:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>',
 layers:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 12.5l9 5 9-5M3 16.8l9 5 9-5"/></svg>',
 clock:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12V8.5a3 3 0 0 0-3-3h-11a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3H12M8 3v4M16 3v4M3.5 10h17"/><circle cx="17" cy="17" r="4"/><path d="M17 15v2l1.2.8"/></svg>',
 sync:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.2-4.5L4 9M4 13a8 8 0 0 0 14.2 4.5L20 15"/><path d="M4 4v5h5M20 20v-5h-5"/></svg>'
};
let jd=ls.get('jadwal_hub',null);
if(!jd||!Array.isArray(jd.tasks))jd={};
jd={tasks:[],backlogs:[],week:{subs:[],per:4,off:[5]},daily:{per:3,subs:['فيزياء','كيمياء','رياضيات']},weekUn:0,...jd};
jd.week.per=jd.week.per||4;jd.daily.per=jd.daily.per||3;
let jdEdit=false,jdSel=null;
function jdSave(){ls.set('jadwal_hub',jd)}
const jdPad=n=>String(n).padStart(2,'0');
const jdFmtD=d=>d.getFullYear()+'-'+jdPad(d.getMonth()+1)+'-'+jdPad(d.getDate());
const jdToday=()=>jdFmtD(new Date());
const jdAdd=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return jdFmtD(d)};
const jdDow=s=>new Date(s+'T12:00:00').getDay();
const jdDateLbl=s=>SCH_DAYS[jdDow(s)]+' '+(+s.slice(8))+'/'+(+s.slice(5,7));
const jdOn=d=>jd.tasks.filter(t=>t.date===d).sort((a,b)=>JD_RANK[a.kind]-JD_RANK[b.kind]);
const jdLate=()=>jd.tasks.filter(t=>!t.done&&t.date<jdToday()).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const jdLec=n=>n===1?'محاضرة':n===2?'محاضرتين':n>=3&&n<=10?n+' محاضرات':n+' محاضرة';
const jdDaysLbl=n=>n===1?'يوم واحد':n===2?'يومين':n<=10?n+' أيام':n+' يوم';
const jdDays=(from,n,off)=>[...Array(n)].map((_,i)=>jdAdd(from,i)).filter(d=>!(off||[]).includes(jdDow(d)));

/* يوزّع المهام على الأيام الأقل حملاً، ويفضّل ما تتكرر المادة بنفس اليوم */
function jdPlace(units,dates,capMin){
 const load={};dates.forEach(d=>load[d]=jd.tasks.filter(t=>t.date===d&&!t.done).reduce((a,t)=>a+t.mins,0));
 let un=0;
 units.forEach(u=>{
  let c=dates.filter(d=>load[d]+u.mins<=capMin);
  if(!c.length){un++;return}
  const fresh=c.filter(d=>!jd.tasks.some(t=>t.date===d&&t.subject===u.subject&&!t.done));
  if(fresh.length)c=fresh;
  c.sort((a,b)=>load[a]-load[b]||(a<b?-1:1));
  const d=c[0];load[d]+=u.mins;
  jd.tasks.push({id:uid(),subject:u.subject,mins:u.mins,kind:u.kind,ref:u.ref||'',date:d,done:false});
 });
 return un;
}

}

function renderSchedule(){
 if(['today','week','busy'].includes(schedTab))return renderScheduleMin();
 if(!['hub','wk','bk','dy','lt'].includes(schedTab))schedTab='hub';
 const td=jdToday();
 if(schedTab==='hub')return jdHub(td);
 if(schedTab==='wk')return jdWeekPage(td);
 if(schedTab==='bk')return jdBackPage(td);
 if(schedTab==='dy')return jdDailyPage(td);
 return jdLatePage(td);
}

function jdHub(td){
 const today=jdOn(td),done=today.filter(t=>t.done).length,pct=today.length?Math.round(done/today.length*100):0,late=jdLate().length;
 const wk=jd.tasks.filter(t=>t.kind==='week'&&!t.done&&t.date>=td).length,bk=jd.tasks.filter(t=>t.kind==='backlog'&&!t.done).length;
 const cards=[
  ['wk','cal','#3b82d6','أريد جدول أسبوعي',wk?`${jdLec(wk)} جاية`:'وزّع موادي على الأسبوع',''],
  ['bk','layers','#1fa37a','عندي تراكمات',bk?`باقي ${jdLec(bk)}`:'أريد أتخلص منها',''],
  ['dy','clock','#9b72d6','أريد أنظم يومي','رتّب لي مهام اليوم',''],
  ['lt','sync',late?'#d98f33':'var(--mut)','متأخر عن جدولي',late?`فاتك ${jdLec(late)}، تعال نرتبها`:'ماشي صح',late?'warn':'dim']
 ];
 jdShell(`<div class="sch-dash-head"><div><small>جدولي الدراسي</small><h2>شتريد اليوم؟</h2></div></div>
 <div class="sch-progress-card"><div class="sch-progress-line"><span>إنجاز اليوم</span><b>${done} / ${today.length}</b></div><div class="sch-meter"><i style="width:${pct}%"></i></div><div class="sch-progress-foot"><span>${today.length?pct+'% مكتمل':'ماكو محاضرات لسه'}</span><span>${jdLec(today.length)} اليوم</span></div></div>
 <div class="jd-grid">${cards.map(c=>`<button class="jd-card ${c[5]}" data-jd-go="${c[0]}" style="--c:${c[2]}"><span class="ic">${JD_ICO[c[1]]}</span><b>${c[3]}</b><small>${c[4]}</small></button>`).join('')}</div>
 <button class="sch-btn jd-imgbtn" data-jd="img">حمّل جدولي كصورة</button>
 <div class="sch-section-head"><h3>محاضرات اليوم</h3><span>${jdLec(today.length)}</span></div>
 ${jdList(td)||'<div class="sch-empty"><strong>اليوم فاضي</strong>اختار قسم من فوق حتى نرتب لك دراستك.</div>'}
 <button class="tt-link" data-sch-tab="today">⏱ جدول بالدقيقة (للمتقدمين)</button>`,false);
}

function jdWeekPage(td){
 const win=[...Array(7)].map((_,i)=>jdAdd(td,i)),inWin=jd.tasks.filter(t=>win.includes(t.date));
 const has=jd.tasks.some(t=>t.kind==='week'&&t.date>=td);
 if(!has||jdEdit){
  const w=jd.week,pick=n=>w.subs.find(x=>x.name===n);
  jdShell(`<div class="sch-dash-head"><div><small>قسم ١</small><h2>جدول أسبوعي</h2></div></div>

function jdAct(k,D){
 const td=jdToday();
 if(k==='img')return jdImage();if(k==='img-share')return jdImgShare();if(k==='wk-edit'){jdEdit=true;return renderSchedule()}
 if(k==='addtask')return jdAddTask(D.date||td);
 if(k==='wk-go'){
  const rows=[...document.querySelectorAll('.jw-sub:checked')].map(c=>({name:c.value,count:Math.max(1,Math.min(14,+document.querySelector(`[data-cnt="${c.value}"]`).value||1))}));

  const per=+$('#jw-per').value,off=ttDays('.tt-d'),dates=jdDays(td,7,off);
  if(!dates.length)return toast('لازم يبقى يوم وحد على الأقل للدراسة');
  jd.week={subs:rows,per,off};
  jd.tasks=jd.tasks.filter(t=>!(t.kind==='week'&&!t.done&&t.date>=td));
  const units=[];for(let n=0;n<14;n++)rows.forEach(r=>{if(n<r.count)units.push({subject:r.name,mins:60,kind:'week'})});
  jd.weekUn=jdPlace(units,dates,per*60);jdSave();jdEdit=false;jdSel=td;return renderSchedule();
 }
 if(k==='bk-go'){
  let name=$('#jb-subj').value;if(name==='other')name=$('#jb-custom').value.trim();

  const cnt=Math.max(1,Math.min(300,+$('#jb-cnt').value||1)),per=+$('#jb-per').value,id=uid();
  jd.backlogs.push({id,subject:name,created:td,per});
  for(let i=0;i<cnt;i++)jd.tasks.push({id:uid(),subject:name,mins:60,kind:'backlog',ref:id,date:jdAdd(td,Math.floor(i/per)),done:false});
  jdSave();renderSchedule();return toast('تخلصها يوم '+jdDateLbl(jdAdd(td,Math.ceil(cnt/per)-1)));
 }
 if(k==='bk-del'){jd.tasks=jd.tasks.filter(t=>!(t.ref===D.id&&!t.done));jd.backlogs=jd.backlogs.filter(b=>b.id!==D.id);jdSave();return renderSchedule()}
 if(k==='dy-go'){
  const subs=[...document.querySelectorAll('.jy-sub:checked')].map(c=>c.value),per=+$('#jy-per').value;
  if(!subs.length)return toast('اختار مادة وحدة على الأقل');

  jd.tasks=jd.tasks.filter(t=>!(t.kind==='daily'&&!t.done&&t.date===td));
  const have=jd.tasks.filter(t=>t.date===td&&!t.done).length,n=per-have;
  if(n<1){jdSave();renderSchedule();return toast('يومك ممتلئ، عندك '+jdLec(have)+' اليوم')}
  jdPlace([...Array(n)].map((_,i)=>({subject:subs[i%subs.length],mins:60,kind:'daily'})),[td],Infinity);

 }
 
if(k==='late-move'){const tm=jdAdd(td,1);jdLate().forEach(t=>t.date=tm);jdSave();schedTab='hub';toast('انقلت لباكر');return renderSchedule()}
 if(k==='late-spread'){
  const late=jdLate(),ids=new Set(late.map(t=>t.id));

  jdPlace(late.map(t=>({subject:t.subject,mins:t.mins,kind:t.kind,ref:t.ref})),jdDays(jdAdd(td,1),7),Infinity);

 }
 if(k==='late-drop'){const ids=new Set(jdLate().map(t=>t.id));jd.tasks=jd.tasks.filter(t=>!ids.has(t.id));jdSave();schedTab='hub';toast('نبدي من جديد 💪');return renderSchedule()}
}

 try{await document.fonts.ready}catch(e){}

 x.direction='rtl';x.textBaseline='middle';

document.addEventListener('click',e=>{
 const stab=e.target.closest('[data-sch-tab]');if(stab){schedTab=stab.dataset.schTab;return renderSchedule()}
 const sday=e.target.closest('[data-sch-day]');if(sday){schedDay=Number(sday.dataset.schDay);schedTab='today';return renderSchedule()}
 const sd=e.target.closest('[data-sch-done]');if(sd){sch.done=sch.done||{};const key=sd.dataset.schDone;sch.done[key]=!sch.done[key];schSave();return renderSchedule()}
 const rm=e.target.closest('[data-sch-remove]');if(rm){const id=rm.dataset.schRemove;sch.backlog=sch.backlog.filter(x=>x.id!==id);Object.keys(sch.done||{}).forEach(k=>{if(k.startsWith('bk_'+id+'_'))delete sch.done[k]});schSave();return renderSchedule()}
 const act=e.target.closest('[data-sch]');if(act){const k=act.dataset.sch;if(k==='quick')return schQuick();if(k==='setup'||k==='settings')return schSetup();if(k==='addbacklog')return schAddBacklog();if(k==='week'){schedTab='week';return renderSchedule()}if(k==='progress'){schedTab='progress';return renderSchedule()}if(k==='home'){schedMode=false;$('#q').parentElement.hidden=false;return render()} }
 const tb=e.target.closest('[data-pick]');
 if(tb){setTheme(tb.dataset.pick);buzz('medium');document.querySelectorAll('.pv').forEach(b=>b.classList.toggle('on',b.dataset.pick==th));return}
 const st=e.target.closest('[data-star]');
 if(st){const f=ls.get('fav',{}),id=st.dataset.star;f[id]?delete f[id]:f[id]=1;ls.set('fav',f);buzz();return render()}
 const nt=e.target.closest('[data-nt]');
 if(nt){$('#m').hidden=true;setNotify(nt.dataset.nt=='1');return}
 if(e.target.closest('[data-prog]')){buzz();return prog()}
const go=e.target.closest('[data-go]');
if(go){const k=go.dataset.go;buzz();
 if(k=='subj'){sv=true;return render()}
 if(k=='new'){vw='new';return render()}
 if(k=='notes'){sm='list';smp=[];return render()}
 if(k=='city')return cityOpen();
 if(k=='sched'){schedMode=true;schedTab='hub';return render()}
 return toast('قريباً ✨')}
 const vb=e.target.closest('[data-vw]');
 if(vb){$('#m').hidden=true;vw=vb.dataset.vw;buzz();return render()}
 if(e.target.closest('[data-bd]'))return badges();
 if(e.target.closest('[data-bell]'))return setNotify(!me.notify);
 const cc=e.target.closest('[data-c]');
 if(cc){const o=byId(cc.dataset.c);if(o)open_(o.x);return}
 if(e.target.closest('[data-goal]')){const s=stt(),G=[1,3,5,10];s.goal=G[(G.indexOf(s.goal)+1)%4];ls.set('stats',s);buzz();render();if(!$('#m').hidden&&$('#m').querySelector('[data-goal]'))prog();return}
 if(e.target.closest('[data-city]'))return cityOpen();
 const sbt=e.target.closest('[data-sm]');
 if(sbt){sm=sbt.dataset.sm;smp=[];buzz();return render()}
 const sa=e.target.closest('[data-sa]');
 if(sa){const x=tree.find(v=>v.id==sm),l=x?cl():[],m=l.find(v=>v.id==sa.closest('[data-id]').dataset.id),i=l.indexOf(m),k=sa.dataset.sa;
  if(!m)return;
  if(k=='edit')return form(m,m.t,l);
  if(k=='up'&&i>0){[l[i-1],l[i]]=[l[i],l[i-1]];return save()}
  if(k=='down'&&i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];return save()}
  if(k=='del'){const go=()=>{l.splice(i,1);save()},mm='حذف «'+m.n+'»؟';tg&&tg.showConfirm?tg.showConfirm(mm,ok=>ok&&go()):confirm(mm)&&go()}
  return}
 const sf=e.target.closest('[data-smf]');
 if(sf){smp.push(sf.dataset.smf);buzz();return render()}
 const so=e.target.closest('[data-smo]');
 if(so){const x=tree.find(v=>v.id==sm),m=(x?cl():[]).find(v=>v.id==so.dataset.smo);if(!m)return;buzz();
  try{/^https:\/\/t\.me\//.test(m.u)?tg.openTelegramLink(m.u):tg.openLink(m.u)}catch(er){window.open(m.u,'_blank')}return}
 const asm=e.target.closest('[data-addsm]');
 if(asm){if(tree.find(v=>v.id==sm))form(null,asm.dataset.addsm,cl());return}
 const s=e.target.closest('[data-s]');
 if(s)return open_(res[+s.dataset.s].x);
 const a=e.target.closest('[data-a]'),ad=e.target.closest('[data-add]');
 const{l}=cur();
 if(ad)return form(null,ad.dataset.add,l);
 if(!a)return;
 const x=l.find(v=>v.id==a.closest('[data-id]').dataset.id),i=l.indexOf(x),k=a.dataset.a;
 if(k=='open')return open_(x);
 if(k=='edit')return form(x,x.t,l);
 if(k=='vip'){x.vip=!x.vip;return save()}
 if(k=='off'){x.off=!x.off;return save()}
 if(k=='up'&&i>0){[l[i-1],l[i]]=[l[i],l[i-1]];return save()}
 if(k=='down'&&i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];return save()}
 if(k=='del'){const go=()=>{l.splice(i,1);save()},m='حذف «'+x.n+'» وكل ما بداخله؟';
  tg&&tg.showConfirm?tg.showConfirm(m,ok=>ok&&go()):confirm(m)&&go()}
});

setTheme(th);
setTimeout(()=>{const e=$('#sp');e&&e.remove()},7000);
(async()=>{
 try{const r=await fetch(`${SUPA}/rest/v1/menu?id=eq.1&select=data`,{headers:{apikey:KEY}});
  tree=((await r.json())[0]||{}).data.subjects||[]}catch(e){tree=[]}
 render();
 setTimeout(()=>{const e=$('#sp');if(e){e.classList.add('o');setTimeout(()=>e.remove(),500)}},450);
 cloudLoad().then(()=>{render();cloudSoon()});
 try{const r=await postApi('/me',{initData:tg?tg.initData:'',streak:ls.get('st',{n:0}).n});
  const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}
  if(!r.ok)diag('الخادم رد بخطأ '+r.status+': '+t.slice(0,140));
  else{me=j;if(!me.admin)diag('الخادم يعمل لكنه لا يعرفك كأدمن. غالباً BOT_TOKEN في Supabase لا يطابق توكن هذا البوت.')}
  render()}catch(e){diag('تعذّر الاتصال بالخادم: '+e.message+' (تأكد أن دالة api منشورة وأن Verify JWT مطفأ)')}
})();
