<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>اختبارات بصمة السادس</title>

<style>
:root{--h:260;--bg:#0d0b22;--bg2:#1a1245;--g1:rgba(120,80,255,.4);--sf:rgba(255,255,255,.08);--ink:#f3f0ff;--mut:#a79fd0;--line:rgba(255,255,255,.14);--acc:#8b6bff;--onacc:#fff;--ts:85%;--tl:60%;--ton:#120d2c;--rad:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:400 16px/1.55 "Readex Pro",Tahoma,sans-serif;color:var(--ink);background:radial-gradient(120% 55% at 50% 0%,var(--g1),transparent 62%),linear-gradient(180deg,var(--bg),var(--bg2)) fixed;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 96px)}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hd,.sr,#hero,#list{position:relative;z-index:1}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 8px}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.hi{color:var(--mut);font-size:13px}
h1{font:800 21px/1.25 "Baloo Bhaijaan 2","Readex Pro",sans-serif;margin:0}
.acts{display:flex;gap:6px;flex:none}
.ib{min-width:40px;height:40px;padding:0 11px;border-radius:14px;border:1px solid var(--line);background:var(--sf);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);display:inline-grid;place-items:center;font:600 14px "Readex Pro",sans-serif}
.ib:active,.it:active{transform:scale(.95)}
.sr{margin:6px 0 14px}
#q{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--sf);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:inherit;outline:0}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
.sum{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:14px;border-radius:20px;background:var(--sf);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sum b{font:800 24px/1 "Baloo Bhaijaan 2",sans-serif;display:block}
small{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list{display:grid;gap:10px}
.it{cursor:pointer;transition:transform .15s}
.tile{position:relative;overflow:hidden;min-height:158px;padding:14px;border-radius:var(--rad);color:var(--ton);display:flex;flex-direction:column;justify-content:space-between;gap:8px;
 background:linear-gradient(150deg,hsl(var(--h) var(--ts) var(--tl)),hsl(calc(var(--h) + 30) var(--ts) calc(var(--tl) - 12%)));
 box-shadow:0 14px 28px -12px hsl(var(--h) var(--ts) var(--tl)),inset 0 2px 0 rgba(255,255,255,.35)}
.tile::after{content:"";position:absolute;inset-inline-start:-34px;top:-34px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none}
.ico{font-size:44px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));position:relative;z-index:1}
.tile .nm{font:800 20px/1.2 "Baloo Bhaijaan 2",sans-serif}
.pg{height:7px;border-radius:6px;background:var(--line);overflow:hidden}
.tile .pg{background:rgba(255,255,255,.4)}
.pg i{display:block;height:100%;border-radius:6px;background:hsl(var(--h) var(--ts) var(--tl))}
.tile .pg i{background:var(--ton);opacity:.7}
.tile small{color:inherit;font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 16px;border-radius:20px;background:var(--sf);border:1px solid var(--line);border-inline-start:6px solid hsl(var(--h) var(--ts) var(--tl));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.row .nm{flex:1;font-weight:600}
.row .nm small{display:block;font-weight:400}
.row i{font-style:normal;color:var(--mut);font-size:13px}
.off{opacity:.45}
.ctl{display:flex;gap:4px;width:100%;justify-content:flex-end;position:relative;z-index:2}
.ctl b{font-weight:400;background:rgba(0,0,0,.4);border-radius:10px;padding:2px 7px;color:#fff}
.empty{text-align:center;color:var(--mut);padding:44px 0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .ib{flex:none;height:38px}
.goal{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;border-radius:20px;background:var(--sf);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);cursor:pointer}
.ring{position:relative;width:66px;height:66px;border-radius:50%;flex:none;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
.ring::after{content:attr(data-t);position:absolute;inset:7px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:800 16px "Baloo Bhaijaan 2",sans-serif}
.gt{flex:1}.gt b{display:block}
.cont{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:12px;border-radius:20px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));color:var(--onacc);cursor:pointer}
.cont b{display:block;font:800 17px "Baloo Bhaijaan 2",sans-serif}
.cont small{color:inherit;opacity:.85}
.star{font-size:19px;color:var(--mut);padding:0 4px}
.star.on{color:#f5b301}
em.nw{font-style:normal;background:#ff3b5c;color:#fff;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.tile em.nw{position:absolute;top:12px;inset-inline-end:12px;z-index:2}
.cf{position:fixed;top:-24px;z-index:40;pointer-events:none;animation:cf 2.4s ease-in forwards}
@keyframes cf{to{transform:translateY(108vh) rotate(540deg)}}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd2{padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--sf);text-align:center}
.bd2 span{font-size:32px;display:block}
.bd2 small{display:block}
.bd2.lk{opacity:.35;filter:grayscale(1)}
.rt{display:grid;gap:10px}
.rt button{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--sf);color:var(--ink);font:600 16px "Readex Pro",sans-serif}
/* ===== شخصية كل مود ===== */
[data-th=night] #fx{background:radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 30%,#fff,transparent),radial-gradient(2px 2px at 40% 60%,#cfc6ff,transparent),radial-gradient(1px 1px at 85% 75%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#fff,transparent),radial-gradient(1px 1px at 55% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 8%,#fff,transparent);animation:tw 3.5s ease-in-out infinite alternate}

[data-th=red] .tile{box-shadow:0 14px 28px -10px hsl(var(--h) 90% 50%/.8),inset 0 2px 0 rgba(255,255,255,.4)}
[data-th=neon] #fx{background:linear-gradient(rgba(0,255,200,.08) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(0,255,200,.08) 1px,transparent 1px) 0 0/34px 34px}
[data-th=neon] .tile{background:rgba(2,12,14,.8);color:var(--ink);border:1.5px solid hsl(var(--h) 100% 55%);box-shadow:0 0 20px hsl(var(--h) 100% 55%/.5),inset 0 0 20px hsl(var(--h) 100% 55%/.16)}
[data-th=neon] .tile::after{display:none}
[data-th=neon] .tile .pg{background:rgba(255,255,255,.12)}
[data-th=neon] .tile .pg i{background:hsl(var(--h) 100% 55%);opacity:1;box-shadow:0 0 8px hsl(var(--h) 100% 55%)}
[data-th=neon] .ico{filter:drop-shadow(0 0 8px hsl(var(--h) 100% 55%))}
[data-th=neon] h1{text-shadow:0 0 14px var(--acc)}
[data-th=sunset] #fx{background:radial-gradient(circle at 82% 12%,#fff6bf 0,#ffd166 5%,rgba(255,150,60,.6) 13%,transparent 30%)}
[data-th=girls] .tile::before{content:"✨";position:absolute;inset-inline-end:12px;bottom:10px;opacity:.75}
.hh{position:absolute;bottom:-40px;animation:fl linear infinite;opacity:0}
@keyframes fl{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-115vh) rotate(28deg);opacity:0}}
[data-th=boys] #fx{background:repeating-linear-gradient(45deg,rgba(21,96,232,.08) 0 8px,transparent 8px 16px),radial-gradient(90% 40% at 100% 0,rgba(21,96,232,.25),transparent 70%)}
[data-th=boys] .tile{border-radius:6px;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));box-shadow:none}
[data-th=boys] .row,[data-th=boys] .sum,[data-th=boys] .ib,[data-th=boys] #q{border-radius:8px}
/* ===== */
#bar{position:fixed;inset:auto 0 0 0;direction:ltr;display:flex;gap:10px;justify-content:flex-start;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg2);border-top:1px solid var(--line);z-index:5}
#bar button,.bt button{direction:rtl;border:0;background:var(--acc);color:var(--onacc);border-radius:14px;padding:11px 18px;font:600 15px "Readex Pro",sans-serif}
.bt .g{background:var(--sf);color:var(--ink);border:1px solid var(--line)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:9}
[hidden]{display:none!important}
.sheet{background:var(--bg2);color:var(--ink);width:100%;max-height:86vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 80px);border-top:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h3{margin:0;font:800 22px "Baloo Bhaijaan 2",sans-serif}
.sheet input{width:100%;margin-bottom:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--sf);color:var(--ink);font:inherit}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{height:100px;border-radius:20px;border:2px solid var(--line);padding:11px;display:flex;flex-direction:column;justify-content:space-between;text-align:start;font:700 16px "Baloo Bhaijaan 2",sans-serif}
.pv span{display:flex;gap:6px}
.pv i{width:36px;height:26px;border-radius:9px}
.pv.on{border-color:var(--acc);outline:2px solid var(--acc)}
.bt{display:flex;gap:10px;margin-top:6px}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:30;font-size:14px}
#fr{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.frbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.frbar b{flex:1;text-align:center;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ifr{flex:1;width:100%;border:0;background:#fff}
#dg{position:relative;z-index:2;margin:6px 0 10px;padding:10px 14px;border-radius:14px;background:#ff3b5c;color:#fff;font-size:13px}
.city{margin-bottom:12px;border-radius:22px;overflow:hidden;background:var(--sf);border:1px solid var(--line);cursor:pointer}
.city svg{display:block;width:100%;height:auto}
.city .ct{padding:8px 14px 12px;display:flex;flex-direction:column;gap:2px}
.city .ct b{font:800 20px "Baloo Bhaijaan 2",sans-serif}
.dst{display:flex;align-items:center;gap:10px;margin:9px 0}
.dst .nm2{width:104px;font-weight:600;font-size:14px}
.dst .pg{flex:1}
.dst small{width:72px;text-align:end}
#sp{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 55% at 50% 0%,var(--g1),transparent 62%),linear-gradient(180deg,var(--bg),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s}
#sp.o{opacity:0;pointer-events:none}
#sp .lg{font-size:76px;animation:bn 1.1s ease-in-out infinite alternate}
@keyframes bn{to{transform:translateY(-10px) scale(1.06)}}
#sp b{font:800 24px "Baloo Bhaijaan 2",sans-serif}
#sp .ld{width:150px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
#sp .ld i{display:block;height:100%;width:40%;border-radius:6px;background:var(--acc);animation:ld 1s ease-in-out infinite alternate}
@keyframes ld{to{transform:translateX(-150%)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}#sp .lg,#sp .ld i{animation:none}*{transition:none!important}#fx{animation:none!important}.hh{display:none}}
/* ===== الصفحة الرئيسية الجديدة ===== */
.ib.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ib svg{display:block}
.hm{display:grid;gap:12px}
.hero2{border-radius:26px;padding:18px;background:color-mix(in srgb,var(--acc) 26%,var(--sf));color:var(--ink);cursor:pointer;transition:transform .15s}
.hero2:active,.card:active{transform:scale(.97)}
.hero2 h2{font:800 25px/1.25 "Baloo Bhaijaan 2",sans-serif;margin:0}
.hero2 small{color:inherit;opacity:.72;font-size:14px}
.hero2 .go{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600}
.hero2 .bk{width:46px;height:46px;border-radius:16px;background:var(--sf);display:grid;place-items:center;color:var(--acc)}
.hero2 .ar{margin-inline-start:auto;font-size:20px}
.st2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;cursor:pointer;transition:transform .15s}
.card .ci{color:var(--acc);display:flex}
.card b{font:800 21px/1.2 "Baloo Bhaijaan 2",sans-serif;display:block}
.card.soon{opacity:.7}
.card em.sn{position:absolute;top:12px;inset-inline-end:12px;font-style:normal;font-size:11px;color:var(--mut);background:var(--line);padding:1px 8px;border-radius:99px}
.sec{font:800 19px "Baloo Bhaijaan 2",sans-serif;margin:8px 2px 0}
.lt{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:8px 16px}
.lh{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.lh b{font:800 18px "Baloo Bhaijaan 2",sans-serif}
.lnk{color:var(--acc);font-size:13px;cursor:pointer}
.lt .r{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.lt .r .ri{font-size:22px}.lt .r .nm{flex:1;font-weight:600}.lt .r .nm small{display:block;font-weight:400}
.sr{margin-top:0}
/* ===== مود كرتون ===== */
[data-th=toon] #fx{background:radial-gradient(rgba(27,27,27,.18) 1.6px,transparent 1.8px) 0 0/20px 20px}
[data-th=toon] .card,[data-th=toon] .hero2,[data-th=toon] .lt,[data-th=toon] .goal,[data-th=toon] .sum,[data-th=toon] .row,[data-th=toon] .city,[data-th=toon] .bd2{border:3px solid #1b1b1b;box-shadow:4px 4px 0 #1b1b1b}
[data-th=toon] .tile{border:3px solid #1b1b1b;box-shadow:5px 5px 0 #1b1b1b}
[data-th=toon] .tile::after{display:none}

[data-th=toon] .card:active,[data-th=toon] .hero2:active,[data-th=toon] .tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b1b1b}
[data-th=toon] .st2 .card:nth-child(4n+1){background:#9be7ff}
[data-th=toon] .st2 .card:nth-child(4n+2){background:#ffb3d1}
[data-th=toon] .st2 .card:nth-child(4n+3){background:#b6f08a}
[data-th=toon] .st2 .card:nth-child(4n+4){background:#ffd37a}
[data-th=toon] .hero2{background:#ff8fb8}
[data-th=toon] .card .ci{color:#1b1b1b}
[data-th=toon] .card em.sn{background:#fff;border:2px solid #1b1b1b;color:#1b1b1b}
[data-th=toon] .pg{background:#fff;border:2px solid #1b1b1b}
[data-th=toon] .sheet{border-top:3px solid #1b1b1b}
[data-th=toon] h1,[data-th=toon] .sec{text-shadow:2px 2px 0 #fff}
.tile{min-height:112px;justify-content:flex-end}
.hd .ib{min-width:36px;height:38px;padding:0 8px}
.acts{gap:5px}
</style>
</head>

CT=['أرض فارغة 🌱','قرية صغيرة 🏡','بلدة 🏘️','مدينة 🏙️','مدينة متألقة 🌆','عاصمة التفوق 👑'],CTS=[0,1,7,15,24,32],
dark=()=>['night','red','neon'].includes(th),
cityTitle=n=>{let i=0;CTS.forEach((t,k)=>{if(n>=t)i=k});return CT[i]},
subjName=x=>x.n.replace(EM,'').trim(),subjEm=x=>(x.n.match(EM)||['📚'])[0];
function levels(){const d=ls.get('done',{});return tree.slice(0,7).map(x=>{const c=x.off?0:cnt(x);return c?lvl(dn(x,d)/c):0})}
function skyline(lv){
 const dk=dark(),win=dk?'#ffd166':'#ffffff';
 let o='<svg viewBox="0 0 336 190" role="img" aria-label="مدينتك"><rect width="336" height="190" style="fill:var(--bg2)"/>';
 o+=dk?'<circle cx="168" cy="26" r="12" fill="#fff6d0"/>'+[[40,20],[90,44],[130,16],[220,40],[290,22],[250,12]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.7" fill="#fff"/>`).join('')
  :'<circle cx="168" cy="28" r="13" fill="#ffd166"/><ellipse cx="60" cy="34" rx="26" ry="8" fill="#fff" opacity=".75"/><ellipse cx="80" cy="28" rx="18" ry="7" fill="#fff" opacity=".75"/>';
 o+='<rect y="160" width="336" height="30" style="fill:var(--sf)"/><path d="M0 160H336" style="stroke:var(--line)" stroke-width="2"/><path d="M0 176H336" stroke="#8884" stroke-dasharray="10 8" stroke-width="2"/>';
 lv.forEach((L,i)=>{const x=286-46*i,col=`hsl(${hue(i)} ${TH[th].ts} ${TH[th].tl})`,em=tree[i]?subjEm(tree[i]):'📚';
  if(!L){o+=`<rect x="${x}" y="146" width="40" height="14" rx="4" fill="none" stroke="#8886" stroke-dasharray="4 3"/><text x="${x+20}" y="158" font-size="12" text-anchor="middle">🌱</text>`;return}
  const h=28+22*(L-1),y=160-h;
  if(L==5)o+=`<circle cx="${x+20}" cy="${y+h/2}" r="${h/2+16}" fill="${col}" opacity=".2"/>`;
  o+=`<rect x="${x}" y="${y}" width="40" height="${h}" rx="3" fill="${col}"/><rect x="${x-2}" y="${y-4}" width="44" height="5" rx="2" fill="#0003"/>`;
  for(let r=0;r<L;r++)for(let c=0;c<3;c++)o+=`<rect x="${x+6+c*12}" y="${y+7+r*22}" width="8" height="9" rx="1.5" fill="${win}" opacity="${(r+c)%2||L>=4?.95:.35}"/>`;
  if(L>=5)o+=`<path d="M${x+20} ${y-4}V${y-22}" stroke="#666" stroke-width="2"/><path d="M${x+20} ${y-22}l12 4-12 4Z" fill="#ff4d6d"/>`;
  });
 return o+'</svg>'}
function cityCard(){const lv=levels(),sum=lv.reduce((a,b)=>a+b,0),
 name=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'';
 return `<div class="city" data-city="1">${skyline(lv)}<div class="ct"><b>مدينة ${esc(name||'الأوائل')}</b><small>${cityTitle(sum)} · ${sum}/35 — اضغط لتفاصيل الأحياء</small></div></div>`}
function cityOpen(){const lv=levels(),d=ls.get('done',{}),sum=lv.reduce((a,b)=>a+b,0),T5=[.0001,.25,.5,.75,1];
 const rows=tree.slice(0,7).map((x,i)=>{const c=x.off?0:cnt(x),f=c?dn(x,d):0,L=lv[i],need=L>=5?0:Math.max(1,Math.ceil(T5[L]*c)-f);
  return `<div class="dst" style="--h:${hue(i)}"><span class="nm2">${esc(subjName(x))}</span><div class="pg"><i style="width:${L*20}%"></i></div><small>${L>=5?'اكتمل 🏆':'باقي '+need}</small></div>`}).join('');
 modal(`${skyline(lv)}<p><b>${cityTitle(sum)}</b> · ${sum}/35</p>${rows}<p><small>كل مادة حيّ في مدينتك، وتكبر لما تنهي اختبارات منها: دقيقتان داخل الاختبار أو زر «خلّصت ✅». المدينة ما تصغر أبداً حتى لو غبت.</small></p>`,null,'','مدينتك 🏙️')}
function prog(){const s=stt(),d=ls.get('done',{}),f=ls.get('fav',{}),st=ls.get('st',{n:0}),tn=(s.days[today()]||[]).length,p=Math.min(100,Math.round(tn/s.goal*100)),fv=Object.keys(f).length,sb=Object.keys(s.badges).length;let TT=0,DD=0;tree.forEach(x=>{if(!x.off){TT+=cnt(x);DD+=dn(x,d)}});
 modal(`<div class="goal" data-goal="1"><div class="ring" style="--p:${p}" data-t="${tn}/${s.goal}"></div><div class="gt"><b>هدف اليوم: ${s.goal} اختبارات</b><small>${tn>=s.goal?'🎉 حققت هدفك! كمّل':'باقي '+(s.goal-tn)+' · اضغط لتغيير الهدف'}</small></div></div>`
 +(TT?`<div class="sum"><div><b>${DD}/${TT}</b><small>اختبار أنجزتها</small></div><div class="pg" style="flex:1"><i style="width:${Math.round(DD/TT*100)}%"></i></div></div>`:'')
 +`<div class="chips" style="flex-wrap:wrap"><button class="ib" data-vw="fav">⭐ المفضلة ${fv}</button><button class="ib" data-bd="1">🏅 إنجازاتي ${sb}/8</button></div><p><small>🔥 سلسلتك ${st.n} يوم متتالي</small></p>`,null,'','تقدّمي 🔥')}
function finishTest(x){
 const lvB=levels(),d=ls.get('done',{}),s=stt(),a=s.days[today()]||(s.days[today()]=[]),before=a.length;
 d[x.id]=1;ls.set('done',d);if(!a.includes(x.id))a.push(x.id);
 const hit=before<s.goal&&a.length>=s.goal;ls.set('stats',s);
 const lvA=levels(),up=lvA.findIndex((l,i)=>l>lvB[i]),got=chk();
 if(up>=0||hit||got.length){party();
  toast(up>=0?'ارتقى حيّ '+subjName(tree[up])+' للمستوى '+lvA[up]+' 🏗️':hit?'🎯 حققت هدف اليوم!':'🏅 إنجاز جديد: '+got[0][2])}
 else toast('✅ تم! كبرت مدينتك شوية');
 render();setTimeout(askNotify,1800)}

const BADGES=[['b1','🌱','البداية','افتح أول اختبار'],['b2','📚','١٠ اختبارات','افتح ١٠ اختبارات'],['b3','🏆','٥٠ اختباراً','افتح ٥٠ اختباراً'],['b4','🔥','٣ أيام','٣ أيام متتالية'],['b5','⚡','٧ أيام','٧ أيام متتالية'],['b6','🎯','هدف اليوم','حقق هدفك اليومي'],['b7','✅','أنهيت فصلاً','أنهِ اختبارات فصل كاملاً'],['b8','👑','أنهيت مادة','أنهِ اختبارات مادة كاملة']];
function chk(){
 const s=stt(),d=ls.get('done',{}),n=Object.keys(d).length,st=ls.get('st',{n:0}),got=[],t=(s.days[today()]||[]).length;
 const ts=c=>(c||[]).filter(v=>v.t=='t'&&!v.off);
 const f7=l=>l.some(x=>x.t=='f'&&!x.off&&((ts(x.c).length>=2&&ts(x.c).every(v=>d[v.id]))||f7(x.c||[])));
 const ok={b1:n>=1,b2:n>=10,b3:n>=50,b4:st.n>=3,b5:st.n>=7,b6:t>=s.goal,b7:f7(tree),b8:tree.some(x=>!x.off&&cnt(x)>=3&&dn(x,d)==cnt(x))};
 for(const b of BADGES)if(ok[b[0]]&&!s.badges[b[0]]){s.badges[b[0]]=Date.now();got.push(b)}
 ls.set('stats',s);return got}
function party(){buzz('heavy');const cs=['🎉','✨','🎊','⭐','💫'];
 for(let i=0;i<26;i++){const e=document.createElement('span');e.className='cf';e.textContent=cs[i%5];
  e.style.cssText=`left:${Math.random()*95}%;font-size:${16+Math.random()*16}px;animation-delay:${Math.random()*.6}s`;document.body.append(e);setTimeout(()=>e.remove(),3200)}}
function badges(){const b=stt().badges;
 modal(`<div class="bg">${BADGES.map(([k,e,n,dsc])=>`<div class="bd2 ${b[k]?'':'lk'}"><span>${e}</span><b>${n}</b><small>${dsc}</small></div>`).join('')}</div>`,null,'','🏅 إنجازاتي')}
function askNotify(){
 if(ls.get('askn')||me.notify)return;ls.set('askn',1);
 modal(`<p>تريد أن يذكّرك البوت يومياً حتى لا تكسر سلسلتك 🔥؟ رسالة وحدة بالمساء فقط، وتقدر توقفها بأي وقت.</p><div class="bt"><button data-nt="1">نعم، ذكّرني</button><button data-nt="0" class="g">لا شكراً</button></div>`,null,'','🔔 تذكير يومي')}
async function setNotify(on){
 try{const r=await postApi('/notify',{initData:tg?tg.initData:'',on});
  if(!r.ok)throw 0;me.notify=on;toast(on?'تم تفعيل التذكير 🔔':'تم إيقاف التذكير');render()}catch(e){toast('تعذّر الحفظ ⚠️')}}

function openTest(x){
 curT=x;openAt=Date.now();$('#frt').textContent=x.n;$('#ifr').src=x.u;$('#fr').hidden=false;frOpen=true;
 $('#frb').onclick=()=>tg&&tg.openLink?tg.openLink(x.u):window.open(x.u,'_blank');
 tg&&tg.BackButton.show()}
function hideFr(){curT=null;$('#fr').hidden=true;$('#ifr').src='about:blank';frOpen=false}
function closeFr(){const x=curT,sec=(Date.now()-openAt)/1000;hideFr();if(x&&sec>=120)finishTest(x);else render()}
$('#frx').onclick=closeFr;
$('#frd').onclick=()=>{const x=curT;if(!x)return;
 if((Date.now()-openAt)/1000<30)return toast('خذ وقتك، لسه ما مرّت نصف دقيقة ⏳');
 hideFr();finishTest(x)};

function open_(x){
 buzz();
 if(x.t=='f'){path.push(x.id);return render()}
 if(x.vip&&!me.vip)return modal(`<p>هذا الاختبار ضمن اشتراك VIP. تواصل مع المطور للاشتراك.</p><p><a href="https://t.me/${DEV}" style="color:var(--acc);font-weight:600">راسل المطور</a></p>`,null,'','🔒 للمشتركين فقط');
 ls.set('last',x.id);render();openTest(x)}

function back(){if(frOpen)return closeFr();if($('#q').value){$('#q').value='';return render()}if(vw){vw=null;return render()}if(sm){if(sm!='list'&&smp.length)smp.pop();else{sm=sm=='list'?null:'list';smp=[]}return render()}if(sv&&!path.length){sv=false;return render()}path.pop();render()}
$('#back').onclick=back;tg&&tg.BackButton.onClick(back);
$('#editb').onclick=()=>{edit=!edit;render()};
$('#pal').onclick=themes;
$('#q').oninput=render;

document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-pick]');
 if(tb){setTheme(tb.dataset.pick);buzz('medium');document.querySelectorAll('.pv').forEach(b=>b.classList.toggle('on',b.dataset.pick==th));return}
 const st=e.target.closest('[data-star]');
 if(st){const f=ls.get('fav',{}),id=st.dataset.star;f[id]?delete f[id]:f[id]=1;ls.set('fav',f);buzz();return render()}
 const nt=e.target.closest('[data-nt]');
 if(nt){$('#m').hidden=true;setNotify(nt.dataset.nt=='1');return}
 if(e.target.closest('[data-prog]')){buzz();return prog()}
const go=e.target.closest('[data-go]');
if(go){const k=go.dataset.go;buzz();
 if(k=='subj'){sv=true;return render()}
 if(k=='new'){vw='new';return render()}
 if(k=='notes'){sm='list';smp=[];return render()}
 if(k=='city')return cityOpen();
 if(k=='sched'){const u='https://t.me/jadwal10_bot';try{tg.openTelegramLink(u)}catch(e){window.open(u,'_blank')}return}
 return toast('قريباً ✨')}
 const vb=e.target.closest('[data-vw]');
 if(vb){$('#m').hidden=true;vw=vb.dataset.vw;buzz();return render()}
 if(e.target.closest('[data-bd]'))return badges();
 if(e.target.closest('[data-bell]'))return setNotify(!me.notify);
 const cc=e.target.closest('[data-c]');
 if(cc){const o=byId(cc.dataset.c);if(o)open_(o.x);return}
 if(e.target.closest('[data-goal]')){const s=stt(),G=[1,3,5,10];s.goal=G[(G.indexOf(s.goal)+1)%4];ls.set('stats',s);buzz();render();if(!$('#m').hidden&&$('#m').querySelector('[data-goal]'))prog();return}
 if(e.target.closest('[data-city]'))return cityOpen();
 const sbt=e.target.closest('[data-sm]');
 if(sbt){sm=sbt.dataset.sm;smp=[];buzz();return render()}
 const sa=e.target.closest('[data-sa]');
 if(sa){const x=tree.find(v=>v.id==sm),l=x?cl():[],m=l.find(v=>v.id==sa.closest('[data-id]').dataset.id),i=l.indexOf(m),k=sa.dataset.sa;
  if(!m)return;
  if(k=='edit')return form(m,m.t,l);
  if(k=='up'&&i>0){[l[i-1],l[i]]=[l[i],l[i-1]];return save()}
  if(k=='down'&&i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];return save()}
  if(k=='del'){const go=()=>{l.splice(i,1);save()},mm='حذف «'+m.n+'»؟';tg&&tg.showConfirm?tg.showConfirm(mm,ok=>ok&&go()):confirm(mm)&&go()}
  return}
 const sf=e.target.closest('[data-smf]');
 if(sf){smp.push(sf.dataset.smf);buzz();return render()}
 const so=e.target.closest('[data-smo]');
 if(so){const x=tree.find(v=>v.id==sm),m=(x?cl():[]).find(v=>v.id==so.dataset.smo);if(!m)return;buzz();
  try{/^https:\/\/t\.me\//.test(m.u)?tg.openTelegramLink(m.u):tg.openLink(m.u)}catch(er){window.open(m.u,'_blank')}return}
 const asm=e.target.closest('[data-addsm]');
 if(asm){if(tree.find(v=>v.id==sm))form(null,asm.dataset.addsm,cl());return}
 const s=e.target.closest('[data-s]');
 if(s)return open_(res[+s.dataset.s].x);
 const a=e.target.closest('[data-a]'),ad=e.target.closest('[data-add]');
 const{l}=cur();
 if(ad)return form(null,ad.dataset.add,l);
 if(!a)return;
 const x=l.find(v=>v.id==a.closest('[data-id]').dataset.id),i=l.indexOf(x),k=a.dataset.a;
 if(k=='open')return open_(x);
 if(k=='edit')return form(x,x.t,l);
 if(k=='vip'){x.vip=!x.vip;return save()}
 if(k=='off'){x.off=!x.off;return save()}
 if(k=='up'&&i>0){[l[i-1],l[i]]=[l[i],l[i-1]];return save()}
 if(k=='down'&&i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];return save()}
 if(k=='del'){const go=()=>{l.splice(i,1);save()},m='حذف «'+x.n+'» وكل ما بداخله؟';
  tg&&tg.showConfirm?tg.showConfirm(m,ok=>ok&&go()):confirm(m)&&go()}
});

setTheme(th);
setTimeout(()=>{const e=$('#sp');e&&e.remove()},7000);
(async()=>{
 try{const r=await fetch(`${SUPA}/rest/v1/menu?id=eq.1&select=data`,{headers:{apikey:KEY}});
  tree=((await r.json())[0]||{}).data.subjects||[]}catch(e){tree=[]}

 cloudLoad().then(()=>{render();cloudSoon()});
 try{const r=await postApi('/me',{initData:tg?tg.initData:'',streak:ls.get('st',{n:0}).n});
  const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}
  if(!r.ok)diag('الخادم رد بخطأ '+r.status+': '+t.slice(0,140));
  else{me=j;if(!me.admin)diag('الخادم يعمل لكنه لا يعرفك كأدمن. غالباً BOT_TOKEN في Supabase لا يطابق توكن هذا البوت.')}
  render()}catch(e){diag('تعذّر الاتصال بالخادم: '+e.message+' (تأكد أن دالة api منشورة وأن Verify JWT مطفأ)')}
})();
